services:
  web:
    build: .
    ports:
      - "8001:8000"
    environment:
      DJANGO_SECRET_KEY: local-docker-key-change-for-production
      DJANGO_DEBUG: "True"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      SQLITE_PATH: /app/data/db.sqlite3
    volumes:
      - blog_data:/app/data
    restart: unless-stopped

volumes:
  blog_data:

