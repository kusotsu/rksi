services:
  web:
    build: .
    restart: unless-stopped
    environment:
      DJANGO_SECRET_KEY: local-docker-key-change-for-production
      DJANGO_DEBUG: "True"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      SQLITE_PATH: /app/data/db.sqlite3
    ports:
      - "${APP_BIND_IP:-127.0.0.1}:${APP_PORT:-8002}:8000"
    volumes:
      - learning_log_data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  learning_log_data:
