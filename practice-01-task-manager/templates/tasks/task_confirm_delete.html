{% extends "base.html" %}

{% block title %}Удаление задачи{% endblock title %}

{% block content %}
<div class="form-shell mx-auto">
  <div class="form-card border-danger">
    <p class="eyebrow text-danger mb-1">Подтверждение</p>
    <h1 class="h3">Удалить задачу?</h1>
    <p class="mt-3">Задача «<strong>{{ task.title }}</strong>» будет удалена без возможности восстановления.</p>
    <form method="post" class="d-flex flex-column flex-sm-row mt-4">
      {% csrf_token %}
      <button class="btn btn-danger" type="submit">Да, удалить</button>
      <a class="btn btn-outline-secondary ml-sm-2 mt-2 mt-sm-0" href="{% url 'tasks:index' %}">Отмена</a>
    </form>
  </div>
</div>
{% endblock content %}
